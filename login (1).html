<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Controle de Estoques - ITEC</title>
    <!-- Google Fonts: Inter & Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .login-page-body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b0f19 70%);
            padding: 20px;
        }
        .login-card {
            background: var(--bg-card, rgba(21, 28, 44, 0.75));
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color, rgba(255, 255, 255, 0.08));
            border-radius: var(--radius-lg, 16px);
            width: 100%;
            max-width: 440px;
            padding: 40px;
            box-shadow: var(--shadow-lg, 0 20px 40px rgba(0,0,0,0.4));
        }
        .server-status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 20px;
            color: #34d399;
            font-size: 0.85rem;
            margin-bottom: 20px;
        }
        .server-status-badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #34d399;
            box-shadow: 0 0 8px #34d399;
        }
    </style>
</head>
<body class="login-page-body">

    <!-- Toast Notifications Container -->
    <div id="toast-container" class="toast-container"></div>

    <div class="login-card">
        <div class="auth-brand">
            <div class="auth-logo">
                <i class="fa-solid fa-boxes-stacked"></i>
            </div>
            <h2>Controle de Estoques - ITEC</h2>
            <p>Sistema de Gestão Multiusuário e Unidades Operacionais</p>
            <div class="server-status-badge">
                <span class="dot"></span> Servidor Online
            </div>
        </div>

        <!-- Login Form -->
        <div id="login-box" class="auth-box active">
            <div class="auth-header">
                <h3>Acesse sua Conta</h3>
                <p>Entre com suas credenciais de usuário</p>
            </div>
            <form id="form-login" onsubmit="executarLogin(event)">
                <div class="form-group">
                    <label for="login-usuario"><i class="fa-solid fa-user"></i> Usuário</label>
                    <input type="text" id="login-usuario" placeholder="Ex: admin" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="login-senha"><i class="fa-solid fa-key"></i> Senha</label>
                    <input type="password" id="login-senha" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" id="btn-entrar" class="btn btn-primary btn-block">
                    <i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema
                </button>
            </form>
            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <p style="color: var(--text-muted, #94a3b8); font-size: 0.9rem;">
                    Deseja cadastrar novo usuário? <a href="/?action=login" onclick="trocarParaRegistro(event)">Criar Conta</a>
                </p>
            </div>
        </div>

        <!-- Register Form (Inicialmente oculto) -->
        <div id="register-box" class="auth-box hidden">
            <div class="auth-header">
                <h3>Novo Cadastro</h3>
                <p>Cadastre um novo operador ou administrador</p>
            </div>
            <form id="form-register" onsubmit="executarRegistro(event)">
                <div class="form-group">
                    <label for="reg-nome"><i class="fa-solid fa-id-card"></i> Nome Completo</label>
                    <input type="text" id="reg-nome" placeholder="Ex: João da Silva" required>
                </div>
                <div class="form-group">
                    <label for="reg-usuario"><i class="fa-solid fa-at"></i> Nome de Usuário (Login)</label>
                    <input type="text" id="reg-usuario" placeholder="Ex: joaosilva" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label for="reg-senha"><i class="fa-solid fa-lock"></i> Senha</label>
                    <input type="password" id="reg-senha" placeholder="Crie uma senha" required autocomplete="new-password">
                </div>
                <div class="form-group">
                    <label for="reg-nivel"><i class="fa-solid fa-user-shield"></i> Nível de Acesso</label>
                    <select id="reg-nivel" required>
                        <option value="Operador">Operador (Entrada/Saída/Consulta)</option>
                        <option value="Supervisor">Supervisor (Produtos e Cadastros, sem Usuários)</option>
                        <option value="Administrador">Administrador (Acesso Total)</option>
                    </select>
                </div>
                <button type="submit" class="btn btn-success btn-block">
                    <i class="fa-solid fa-user-plus"></i> Finalizar Cadastro
                </button>
            </form>
            <div class="auth-footer" style="margin-top: 20px; text-align: center;">
                <p style="color: var(--text-muted, #94a3b8); font-size: 0.9rem;">
                    Já possui conta? <a href="#" onclick="trocarParaLogin(event)">Voltar ao Login</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            let icon = 'fa-info-circle';
            if (type === 'success') icon = 'fa-circle-check';
            if (type === 'error') icon = 'fa-circle-exclamation';

            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(-10px)';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function trocarParaRegistro(e) {
            if(e) e.preventDefault();
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('login-box').classList.remove('active');
            document.getElementById('register-box').classList.remove('hidden');
            document.getElementById('register-box').classList.add('active');
        }

        function trocarParaLogin(e) {
            if(e) e.preventDefault();
            document.getElementById('register-box').classList.add('hidden');
            document.getElementById('register-box').classList.remove('active');
            document.getElementById('login-box').classList.remove('hidden');
            document.getElementById('login-box').classList.add('active');
        }

        async function executarLogin(event) {
            event.preventDefault();
            const usuario = document.getElementById('login-usuario').value.trim();
            const senha = document.getElementById('login-senha').value.trim();
            const btn = document.getElementById('btn-entrar');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha })
                });
                const data = await response.json();

                if (data.success) {
                    localStorage.setItem('stock_user', JSON.stringify(data.user));
                    showToast(data.message, 'success');
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 800);
                } else {
                    showToast(data.message, 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema';
                }
            } catch (error) {
                showToast('Erro ao se conectar ao servidor Python.', 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Entrar no Sistema';
            }
        }

        async function executarRegistro(event) {
            event.preventDefault();
            const nome_usuario = document.getElementById('reg-nome').value.trim();
            const usuario = document.getElementById('reg-usuario').value.trim();
            const senha = document.getElementById('reg-senha').value.trim();
            const nivel_acesso = document.getElementById('reg-nivel').value;

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, senha, nome_usuario, nivel_acesso })
                });
                const data = await response.json();

                if (data.success) {
                    showToast(data.message, 'success');
                    document.getElementById('form-register').reset();
                    trocarParaLogin();
                } else {
                    showToast(data.message, 'error');
                }
            } catch (error) {
                showToast('Erro ao se conectar ao servidor.', 'error');
            }
        }
    </script>
</body>
</html>

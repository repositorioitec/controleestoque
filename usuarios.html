<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Usuários</title><link rel="stylesheet" href="styles.css"><body><main class="auth-panel"><section class="auth-card" style="max-width:900px"><p class="eyebrow">ADMINISTRAÇÃO</p><h2>Usuários</h2><p>Novos usuários precisam ser aprovados para acessar o sistema.</p><table><thead><tr><th>Nome</th><th>E-mail</th><th>Status</th><th>Ação</th></tr></thead><tbody id="r"></tbody></table></section></main><script>const q=s=>document.querySelector(s);async function load(){let a=await fetch('/api/users').then(r=>r.json());q('#r').innerHTML=a.map(x=>'<tr><td>'+x.name+'</td><td>'+x.email+'</td><td>'+ (x.approved?'Aprovado':'Pendente')+'</td><td>'+(!x.approved?'<button onclick="approve(\''+x.id+'\')">Aprovar</button>':'')+'</td></tr>').join('')}async function approve(id){await fetch('/api/users/'+id+'/approve',{method:'PUT'});load()}load()</script></body></html>

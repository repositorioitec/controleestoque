<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Abastecimentos</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}}</style><body><main class="page"><section class="card"><p class="eyebrow">LANCAMENTOS</p><h2>Abastecimento</h2><form id="f" class="form-stack"><label>Data<input name="date" type="date" required></label><label>Placa<select name="vehicle_id" id="v" required></select></label><label>Kilometragem<input name="mileage" type="number"></label><label>Preco por litro<input name="price_per_liter" type="number" step=".01"></label><label>Quantidade de litros<input name="quantity_liters" type="number" step=".01"></label><label>Motorista<select name="driver_id" id="d" required></select></label><label>Posto<select name="station_id" id="s" required></select></label><label>Observacoes<textarea name="notes"></textarea></label><button class="button button-primary">Salvar abastecimento</button></form><p id="msg" style="font-weight:700;color:#187444"></p><hr><h2>Abastecimentos cadastrados</h2><table><thead><tr><th>Data</th><th>Placa</th><th>Motorista</th><th>Posto</th><th>Kilometragem</th><th>Preco/L</th><th>Litros</th><th>Observacoes</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);const fmtDate=v=>{let a=String(v).slice(0,10).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v};async function l(u,e,k){let a=await fetch('/api/'+u).then(r=>r.json());q(e).innerHTML='<option value="">Selecione</option>'+a.map(x=>'<option value="'+x.id+'">'+x[k]+'</option>').join('')}async function load(){let a=await fetch('/api/fuelings').then(r=>r.json());q('#list').innerHTML=a.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+ (x.plate||'-')+'</td><td>'+ (x.driver_name||'-')+'</td><td>'+ (x.station_name||'-')+'</td><td>'+x.mileage+'</td><td>R$ '+x.price_per_liter+'</td><td>'+x.quantity_liters+'</td><td>'+ (x.notes||'')+'</td></tr>').join('')}Promise.all([l('vehicles','#v','plate'),l('drivers','#d','name'),l('partner_stations','#s','name'),load()]);q('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/fuelings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){q('#msg').textContent='Dados salvos com sucesso!';e.target.reset();load()}else{q('#msg').style.color='#b42318';q('#msg').textContent='Nao foi possivel salvar o abastecimento.'}}</script></body></html>

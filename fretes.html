<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Lançamento de Fretes</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}}</style><body><main class="page"><section class="card"><p class="eyebrow">LANÇAMENTOS</p><h2>Lançamento de frete</h2><form id="f" class="form-stack"><label>Data<input name="date" type="date" required></label><label>Motorista<select name="driver_id" id="d" required></select></label><label>Placa<select name="vehicle_id" id="v" required></select></label><label>Cliente<select name="client_id" id="c" required></select></label><label>Destino<input name="destination" required></label><label>Frete<input name="freight" type="number" step=".01" required></label><label>Pedágios<input name="tolls" type="number" value="0"></label><label>Despesas<input name="expenses" type="number" value="0"></label><button class="button button-primary">Salvar lançamento</button></form><hr><h2>Lançamentos cadastrados</h2><table><thead><tr><th>Data</th><th>Motorista</th><th>Placa</th><th>Cliente</th><th>Destino</th><th>Frete</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);const fmtDate=v=>{let a=String(v).slice(0,10).split('-');return a.length===3?a[2]+'/'+a[1]+'/'+a[0]:v};async function l(u,e,t){let a=await fetch('/api/'+u).then(r=>r.json());q(e).innerHTML='<option value="">Selecione</option>'+a.map(x=>'<option value="'+x.id+'">'+x[t]+'</option>').join('')}async function load(){let a=await fetch('/api/freight_entries').then(r=>r.json());q('#list').innerHTML=a.map(x=>'<tr><td>'+fmtDate(x.date)+'</td><td>'+x.driver_name+'</td><td>'+x.plate+'</td><td>'+x.client_name+'</td><td>'+x.destination+'</td><td>R$ '+Number(x.freight).toFixed(2)+'</td></tr>').join('')}Promise.all([l('drivers','#d','name'),l('vehicles','#v','plate'),l('clients','#c','name'),load()]);q('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/freight_entries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){alert('Dados salvos com sucesso!');e.target.reset();load()}else alert('Erro ao salvar.')}</script></body></html>

<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Relatório de Abastecimentos</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.report{padding:36px;max-width:1500px;margin:auto}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;background:#fff;padding:20px;border:1px solid #e5e7eb;border-radius:10px;margin:20px 0}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin:20px 0}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:10px;padding:20px}.stat span{color:#64748b;font-size:13px}.stat strong{display:block;font-size:28px;color:#102a43;margin-top:7px}.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}@page{size:A4 landscape;margin:12mm}@media print{.filters,.eyebrow{display:none!important}.report{padding:0;max-width:none}.table-wrap{border:0}}@media(max-width:700px){.report{padding:18px}.filters{grid-template-columns:1fr}}</style><body><main class="report"><p class="eyebrow">RELATORIOS</p><h1>Relatório de abastecimentos</h1><section class="filters"><label>Placa<select id="plate"><option value="">Todas</option></select></label><label>Motorista<select id="driver"><option value="">Todos</option></select></label><label>De<input id="start" type="date"></label><label>Até<input id="end" type="date"></label><button class="button button-secondary" id="clear">Limpar</button><button class="button button-primary" onclick="window.print()">Imprimir / PDF</button></section><section class="stats"><article class="stat"><span>Total de km rodados</span><strong id="total-km">0 km</strong></article><article class="stat"><span>Média de km</span><strong id="average-km">0 km</strong></article></section><div class="table-wrap"><table><thead><tr><th>Data</th><th>Placa</th><th>Motorista</th><th>Posto</th><th>Km</th><th>Preço/L</th><th>Litros</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const q=s=>document.querySelector(s);let all=[];function date(v){let a=String(v).slice(0,10).split('-');return a[2]+'/'+a[1]+'/'+a[0]}function render(){let p=q('#plate').value,d=q('#driver').value,a=q('#start').value,b=q('#end').value,list=all.filter(x=>(!p||x.vehicle_id===p)&&(!d||x.driver_id===d)&&(!a||x.date>=a)&&(!b||x.date<=b)),kms=list.map(x=>Number(x.mileage)||0),total=kms.reduce((x,y)=>x+y,0);q('#total-km').textContent=total.toLocaleString('pt-BR')+' km';q('#average-km').textContent=(list.length?total/list.length:0).toLocaleString('pt-BR',{maximumFractionDigits:2})+' km';q('#rows').innerHTML=list.map(x=>'<tr><td>'+date(x.date)+'</td><td>'+x.plate+'</td><td>'+x.driver_name+'</td><td>'+x.station_name+'</td><td>'+Number(x.mileage).toLocaleString('pt-BR')+'</td><td>R$ '+x.price_per_liter+'</td><td>'+x.quantity_liters+'</td><td>R$ '+(x.price_per_liter*x.quantity_liters).toFixed(2)+'</td></tr>').join('')}fetch('/api/fuelings').then(r=>r.json()).then(a=>{all=a;for(let [id,n] of new Map(a.map(x=>[x.vehicle_id,x.plate])))q('#plate').innerHTML+='<option value="'+id+'">'+n+'</option>';for(let [id,n] of new Map(a.map(x=>[x.driver_id,x.driver_name])))q('#driver').innerHTML+='<option value="'+id+'">'+n+'</option>';render()});document.querySelectorAll('select,input').forEach(x=>x.oninput=render);q('#clear').onclick=()=>{document.querySelectorAll('select,input').forEach(x=>x.value='');render()}</script></body></html>

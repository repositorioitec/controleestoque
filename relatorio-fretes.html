<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Relatório de Fretes</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.report{padding:36px;max-width:1500px;margin:auto}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;background:#fff;padding:20px;border:1px solid #e5e7eb;border-radius:10px;margin:20px 0}.table-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:10px}table{width:100%;border-collapse:collapse}th,td{padding:14px;text-align:left;border-bottom:1px solid #e5e7eb;font-size:13px}@page{size:A4 landscape;margin:12mm}@media print{body{background:#fff}body>*{visibility:hidden}.report,.report *{visibility:visible}.report{position:absolute;left:0;top:0;width:100%;max-width:none;padding:0}.filters,.eyebrow{display:none!important}.table-wrap{border:0}th,td{font-size:10px;padding:7px}}@media(max-width:800px){.report{padding:18px}.filters{grid-template-columns:1fr 1fr}}</style><body><main class="report"><p class="eyebrow">RELATÓRIOS</p><h1>Relatório de fretes</h1><section class="filters"><label>Motorista<select id="driver"><option value="">Todos</option></select></label><label>Cliente<select id="client"><option value="">Todos</option></select></label><label>Destino<input id="destination"></label><label>De<input id="start" type="date"></label><label>Até<input id="end" type="date"></label><button class="button button-secondary" id="clear">Limpar</button><button class="button button-primary" onclick="window.print()">Imprimir / PDF</button></section><div class="table-wrap"><table><thead><tr><th>Data</th><th>Motorista</th><th>Placa</th><th>Cliente</th><th>Destino</th><th>Frete</th><th>Comissão</th><th>Pedágios</th><th>Despesas</th></tr></thead><tbody id="rows"></tbody></table></div></main><script>const q=s=>document.querySelector(s);let all=[];const m=v=>'R$ '+Number(v||0).toFixed(2);const fmtDate=v=>{let a=String(v).slice(0,10).split('-');return a[2]+'/'+a[1]+'/'+a[0]};function render(){let d=q('#driver').value,c=q('#client').value,x=q('#destination').value.toLowerCase(),a=q('#start').value,b=q('#end').value;q('#rows').innerHTML=all.filter(r=>(!d||r.driver_id===d)&&(!c||r.client_id===c)&&(!x||r.destination.toLowerCase().includes(x))&&(!a||r.date>=a)&&(!b||r.date<=b)).map(r=>'<tr><td>'+fmtDate(r.date)+'</td><td>'+r.driver_name+'</td><td>'+r.plate+'</td><td>'+r.client_name+'</td><td>'+r.destination+'</td><td>'+m(r.freight)+'</td><td>'+m(r.freight*.25)+'</td><td>'+m(r.tolls)+'</td><td>'+m(r.expenses)+'</td></tr>').join('')}fetch('/api/freight_entries').then(r=>r.json()).then(a=>{all=a;for(let [id,n] of new Map(a.map(x=>[x.driver_id,x.driver_name])))q('#driver').innerHTML+='<option value="'+id+'">'+n+'</option>';for(let [id,n] of new Map(a.map(x=>[x.client_id,x.client_name])))q('#client').innerHTML+='<option value="'+id+'">'+n+'</option>';render()});document.querySelectorAll('input,select').forEach(e=>e.oninput=render);q('#clear').onclick=()=>{document.querySelectorAll('.filters input,.filters select').forEach(x=>x.value='');render()}</script></body></html>

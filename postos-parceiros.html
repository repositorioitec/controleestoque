<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Postos Parceiros</title><link rel="stylesheet" href="styles.css"><style>body{background:#f6f8fb}.page{padding:36px}.card{max-width:none;padding:28px}.form-stack{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.form-stack button{grid-column:1;justify-self:start;padding:9px 14px}@media(max-width:700px){.form-stack{grid-template-columns:1fr}}</style><body><main class="page"><section class="card"><p class="eyebrow">CADASTROS</p><h2>Posto parceiro</h2><form id="f" class="form-stack"><label>Nome<input name="name" required></label><label>CNPJ<input name="cnpj"></label><label>Telefone<input name="phone"></label><label>Endereço<input name="address"></label><label>Cidade<input name="city"></label><label>UF<input name="state"></label><button class="button button-primary">Salvar posto</button></form><h2>Postos cadastrados</h2><table><thead><tr><th>Posto</th><th>CNPJ</th><th>Telefone</th><th>Cidade/UF</th></tr></thead><tbody id="list"></tbody></table></section></main><script>const q=s=>document.querySelector(s);async function load(){let a=await fetch('/api/partner_stations').then(r=>r.json());q('#list').innerHTML=a.map(x=>'<tr><td>'+x.name+'</td><td>'+x.cnpj+'</td><td>'+x.phone+'</td><td>'+x.city+'/'+x.state+'</td></tr>').join('')}q('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/partner_stations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});if(r.ok){alert('Posto salvo com sucesso!');e.target.reset();load()}};load()</script></body></html>
